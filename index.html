<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공룡 점프 게임</title>
<style>
:root {
  --bg: #f7f7f7; --fg: #535353; --muted: #8a8a8a; --btn: #e4e4e4;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #202124; --fg: #d4d4d4; --muted: #8a8a8a; --btn: #35363a; }
}
:root[data-theme="dark"] { --bg: #202124; --fg: #d4d4d4; --muted: #8a8a8a; --btn: #35363a; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; height: 100%; touch-action: none; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Courier New", ui-monospace, monospace;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
.wrap { width: 100%; max-width: 760px; padding: 12px; box-sizing: border-box; }
h1 { font-size: 16px; margin: 0; letter-spacing: 1px; color: var(--muted); font-weight: normal; }
canvas#c { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.btns { display: flex; gap: 8px; }
.ibtn { background: var(--btn); color: var(--fg); border: 0; border-radius: 10px; width: 44px; height: 36px; font-size: 18px; touch-action: none; }
.ibtn.on { outline: 2px solid #ff5252; }
.hint { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
.ver { margin-top: 6px; font-size: 10px; color: var(--muted); text-align: center; opacity: .6; }
#shop { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
.panel { background: var(--bg); color: var(--fg); border-radius: 16px; width: 100%; max-width: 480px; max-height: 100%;
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 14px; box-sizing: border-box; }
.shop-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 16px; }
.shop-top button { background: var(--btn); color: var(--fg); border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; }
#charGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { border: 2px solid var(--rc, var(--btn)); border-radius: 12px; padding: 8px 6px; text-align: center; }
.card.sel { border-color: #f5b301 !important; }
.card.r3 { box-shadow: 0 0 10px rgba(255,152,0,.35); }
.card.r4 { animation: mythic 2s ease-in-out infinite; }
@keyframes mythic { 0%,100% { box-shadow: 0 0 6px rgba(255,23,68,.35); } 50% { box-shadow: 0 0 18px rgba(255,23,68,.75); } }
.sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: bold; }
.sec i { flex: 1; height: 2px; background: currentColor; opacity: .35; }
.badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; color: #fff; margin-left: 4px; vertical-align: middle; }
.card canvas { width: 100px; height: 72px; }
.card .nm { font-size: 13px; margin: 2px 0 0; }
.card .pr { font-size: 11px; color: var(--muted); margin: 2px 0 6px; min-height: 14px; }
.card button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: var(--btn); color: var(--fg); font: inherit; font-size: 13px; }
.card button:disabled { opacity: .45; }
.confirm { position: absolute; inset: 0; z-index: 11; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
.confirm .box { background: var(--bg); color: var(--fg); border-radius: 14px; padding: 18px; width: 100%; max-width: 320px; text-align: center; font-size: 14px; line-height: 1.7; }
.confirm .row { display: flex; gap: 10px; margin-top: 14px; }
.confirm button { flex: 1; padding: 12px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; background: var(--btn); color: var(--fg); }
.confirm button.go { background: #f5b301; color: #222; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>DINO RUN</h1>
    <div class="btns">
      <button class="ibtn" id="hardBtn" aria-label="시작 구간 선택">🌵</button>
      <button class="ibtn" id="shopBtn" aria-label="캐릭터 상점">🛒</button>
      <button class="ibtn" id="theme" aria-label="다크 모드 전환">🌙</button>
    </div>
  </div>
  <canvas id="c" width="700" height="260"></canvas>
  <div class="hint">탭 = 점프 (공중에서 한 번 더 = 2단 점프) · 아래로 스와이프 = 잠깐 숙이기<br>
    선인장·가시·구덩이는 딱 맞는 타이밍에 점프하면 🪙을 전부 먹어요<br>
    낮게 나는 새는 숙여서 · 높이 나는 새는 점프하면 부딪혀요<br>
    구간: 사막 → 하늘성 2000 → 우주 4000 → 지옥 8000 → 천국 16000<br>
    🌵 버튼 = 시작 구간 선택 · 캐릭터 등급이 높을수록 ♥ 목숨이 늘어요</div>
  <div class="ver" id="ver"></div>
</div>

<div id="shop" hidden>
  <div class="panel">
    <div class="shop-top"><b>🪙 <span id="goldTotal">0</span></b><button id="shopClose">닫기</button></div>
    <div id="charGrid"></div>
  </div>
  <div class="confirm" id="confirm" hidden>
    <div class="box">
      <div id="confirmMsg"></div>
      <div class="row"><button id="cNo">취소</button><button class="go" id="cYes">구매</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  const VERSION = '20261003-5';
  document.getElementById('ver').textContent = 'v' + VERSION;

  const root = document.documentElement;
  try { const t = localStorage.getItem('dino-theme'); if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); } catch (e) {}
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 700, H = 260, GROUND = 228;
  const CEIL_Y0 = GROUND - 170, CEIL_Y1 = GROUND - 140;   // 천장 장애물: 1단 점프는 지나가고 2단 점프는 막힘

  let TFG = '#535353', TBG = '#f7f7f7', FG = TFG, BG = TBG;   // T*: 라이트/다크 테마 색, FG/BG: 현재 구간 색
  const readColors = () => {
    const cs = getComputedStyle(root);
    TFG = cs.getPropertyValue('--fg').trim() || TFG;
    TBG = cs.getPropertyValue('--bg').trim() || TBG;
    FG = TFG; BG = TBG;
  };
  readColors();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) {}

  // ---------- 저장 ----------
  let save = { gold: 0, owned: [0], sel: 0, hi: 0, startStage: 0 };
  try {
    const s = JSON.parse(localStorage.getItem('dino-save') || 'null');
    if (s && typeof s === 'object') save = Object.assign(save, s);
    if (s && s.hardStart && !s.startStage) save.startStage = 2;   // 예전 "시작부터 하드모드" → 우주 구간
    const old = parseInt(localStorage.getItem('dino-hi') || '0', 10);
    if (old > save.hi) save.hi = old;
  } catch (e) {}
  if (!Array.isArray(save.owned) || !save.owned.includes(0)) save.owned = [0].concat(save.owned || []);
  const persist = () => { try { localStorage.setItem('dino-save', JSON.stringify(save)); } catch (e) {} };
  const isOwned = i => save.owned.includes(i);

  // ---------- 색 도우미 ----------
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mixHex = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const rgba = (h, a) => { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const wrap = (v, m) => ((v % m) + m) % m;

  // ---------- 등급 / 목숨 / 캐릭터 ----------
  const RARITY = [
    { name: '일반', color: '#9e9e9e' }, { name: '희귀', color: '#2196f3' }, { name: '영웅', color: '#9c27b0' },
    { name: '전설', color: '#ff9800' }, { name: '신화', color: '#ff1744' },
  ];
  const LIVES = [1, 2, 3, 4, 5];   // 등급별 목숨 (기본 1개)
  const CHARS = [
    { name: '공룡',       rar: 0, cost: 0,     color: null,      acc: 'none' },
    { name: '초록이',     rar: 0, cost: 25,    color: '#43a047', acc: 'none' },
    { name: '멋쟁이',     rar: 0, cost: 50,    color: '#1e88e5', acc: 'shades' },
    { name: '리본공룡',   rar: 1, cost: 85,    color: '#ec407a', acc: 'bow' },
    { name: '마법사',     rar: 1, cost: 150,   color: '#26a69a', acc: 'wizard' },
    { name: '황금왕',     rar: 1, cost: 250,   color: '#e0a800', c2: '#ffd54f', acc: 'crown' },
    { name: '노을',       rar: 2, cost: 430,   color: '#ff7043', c2: '#ab47bc', acc: 'none', spark: '#ffe0b2', trail: 'spark' },
    { name: '사이버',     rar: 2, cost: 680,   color: '#3949ab', c2: '#00bcd4', acc: 'visor', glow: '#00e5ff', trail: 'spark', spark: '#80deea', eye: '#00e5ff' },
    { name: '불꽃',       rar: 2, cost: 1000,  color: '#ffca28', c2: '#d84315', acc: 'flame', trail: 'flame', glow: '#ff9100', eye: '#3e2723' },
    { name: '우주인',     rar: 3, cost: 1500,  ol: '#607d8b', color: '#cfd8dc', c2: '#78909c', acc: 'helmet', back: 'jet', spark: '#ffffff', eye: '#263238' },
    { name: '무지개',     rar: 3, cost: 2400,  fx: 'rainbow', acc: 'crown', back: 'rainbow', spark: '#ffffff', glow: '#ffffff', eye: '#ffffff' },
    { name: '다이아',     rar: 3, cost: 3400,  ol: '#00838f', color: '#b2ebf2', c2: '#00acc1', acc: 'diamond', back: 'shards', glow: '#80deea', spark: '#ffffff', eye: '#006064' },
    { name: '용왕',       rar: 3, cost: 5100,  color: '#8e24aa', c2: '#ffb300', acc: 'horns', wings: true, back: 'inferno', glow: '#ffab00', spark: '#ffe082', eye: '#fff59d' },
    { name: '디바',       rar: 4, cost: 6400,  color: '#ff4081', c2: '#aa00ff', acc: 'heartpin', face: 'diva', hair: '#ffd54f', legs: '#d50000', shine: true, back: 'hearts', glow: '#ff80ab', spark: '#ffd1e8', eye: '#311b92' },
    { name: '시크블랙',   rar: 4, cost: 8500,  color: '#37474f', c2: '#90a4ae', acc: 'shades', scarf: '#e53935', shine: true, back: 'shadow', glow: '#ff1744', spark: '#ff8a80', eye: '#ffffff' },
    { name: '뱀파이어',   rar: 4, cost: 12000, color: '#ad1457', c2: '#4a148c', acc: 'none', face: 'fangs', cape: '#b71c1c', shine: true, back: 'bats', glow: '#d500f9', spark: '#ff80ab', eye: '#ffeb3b' },
    { name: '오로라여왕', rar: 4, cost: 17000, fx: 'aurora', acc: 'tiara', face: 'diva', shine: true, back: 'aurora', glow: '#b388ff', spark: '#ffffff', eye: '#4a148c' },
    { name: '용사',       rar: 2, cost: 700,   color: '#1976d2', c2: '#90caf9', acc: 'hero', cape: '#d32f2f', shine: true, trail: 'spark', spark: '#ffe082', eye: '#ffffff' },
    { name: '공주',       rar: 2, cost: 850,   ol: '#c2185b', color: '#f8bbd0', c2: '#ce93d8', acc: 'tiaraGold', face: 'princess', hair: '#ffe082', dress: '#f06292', trail: 'spark', spark: '#ffffff', eye: '#6a1b9a' },
    { name: '천사',       rar: 3, cost: 2000,  ol: '#c9a227', color: '#fffde7', c2: '#ffe082', acc: 'halo', wings: true, wbig: true, wcol: '#ffffff', wout: '#c9a227', back: 'feathers', glow: '#fff59d', spark: '#fff59d', eye: '#5d4037' },
    { name: '마왕',       rar: 3, cost: 2800,  color: '#3b1244', c2: '#9b0000', acc: 'demon', wings: true, wbig: true, wcol: '#7f0000', cape: '#7f0000', back: 'hellfire', glow: '#ff1744', eye: '#ffeb3b' },
  ];
  if (!CHARS[save.sel] || !isOwned(save.sel)) save.sel = 0;

  const BODY = [
    "............########",
    "............########",
    "............##.#####",
    "............########",
    "............########",
    "............#####...",
    "............#######.",
    "#..........#####....",
    "#.........######....",
    "##.......#######.#..",
    "###.....########.#..",
    "################.#..",
    "################.#..",
    ".#############......",
    "..###########.......",
    "...##########.......",
  ];
  const LEGS = [
    ["....####.####......","....###..#.........","....##...###.......","....###............"],
    ["....####.####......","....#....###.......","....###..##........","...........###....."],
  ];
  const S = 2;
  const SHADOW_CH = { color: '#1a1a1a' };
  function rowStyle(ch, r, t) {
    if (ch.legs && r >= 16) return ch.legs;
    if (ch.fx === 'rainbow') return 'hsl(' + ((r * 17 + t * 4) % 360) + ',85%,58%)';
    if (ch.fx === 'aurora') return 'hsl(' + Math.round(200 + 90 * Math.sin(t / 40 + r * 0.3)) + ',78%,70%)';
    if (ch.c2) return mixHex(ch.color, ch.c2, Math.min(1, r / 19));
    return ch.color || FG;
  }
  function drawRows(c, rows, x, y, ch, r0, t) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r].padEnd(20, '.');
      c.fillStyle = rowStyle(ch, r0 + r, t);
      for (let col = 0; col < row.length; col++) if (row[col] === '#') c.fillRect(x + col * S, y + r * S, S, S);
    }
  }
  const star = (c, cx, cy, s) => { c.fillRect(Math.round(cx) - 1, Math.round(cy) - s, 2, s * 2); c.fillRect(Math.round(cx) - s, Math.round(cy) - 1, s * 2, 2); };
  const heart = (c, x, y, s) => {
    x = Math.round(x); y = Math.round(y);
    c.fillRect(x - 2 * s, y - 2 * s, 2 * s, s); c.fillRect(x + s, y - 2 * s, 2 * s, s);
    c.fillRect(x - 2 * s, y - s, 5 * s, s); c.fillRect(x - s, y, 3 * s, s); c.fillRect(x, y + s, s, s);
  };
  function trailFlame(c, x, y, t, duck) {
    const cols = ['#fff176', '#ffb300', '#ff6d00', '#d84315', '#8d2c00'];
    for (let i = 0; i < 5; i++) {
      const sz = 7 - i, fy = y + (duck ? 10 : 18) + Math.sin(t / 3 + i * 1.4) * 3;
      c.globalAlpha = 0.9 - i * 0.16; c.fillStyle = cols[i];
      c.fillRect(Math.round(x - 8 - i * 8), Math.round(fy - sz / 2), sz, sz);
    }
    c.globalAlpha = 1;
  }
  function trailSpark(c, x, y, t, col) {
    c.fillStyle = col;
    for (let i = 0; i < 6; i++) {
      c.globalAlpha = Math.max(0, (1 - i / 6) * (0.45 + 0.4 * Math.sin(t / 5 + i * 1.7)));
      star(c, x - 8 - i * 9, y + 22 + Math.sin(t / 4 + i * 1.3) * 7, 2 + (i % 2));
    }
    c.globalAlpha = 1;
  }
  function sparkles(c, x, y, t, col) {
    c.fillStyle = col;
    for (let i = 0; i < 4; i++) {
      const a = t / 22 + i * 1.57;
      c.globalAlpha = 0.45 + 0.5 * Math.sin(t / 6 + i * 2);
      star(c, x + 22 + Math.cos(a) * (28 + (i % 2) * 6), y + 16 + Math.sin(a) * 24, 3);
    }
    c.globalAlpha = 1;
  }
  // 전설/신화 전용: 캐릭터 뒤에 그려지는 고유 이펙트
  function backFx(c, k, x, y, t, duck, ch) {
    const by = y + (duck ? 10 : 20);
    c.globalAlpha = 1;
    if (k === 'jet') {
      for (let i = 0; i < 6; i++) {
        const sz = 8 - i; c.globalAlpha = 0.95 - i * 0.14;
        c.fillStyle = i < 2 ? '#ffffff' : i < 4 ? '#80d8ff' : '#2979ff';
        c.fillRect(Math.round(x - 6 - i * 7), Math.round(by + Math.sin(t / 2.5 + i) * 2 - sz / 2), sz + 2, sz);
      }
      c.fillStyle = '#b0bec5';
      for (let i = 0; i < 4; i++) { c.globalAlpha = 0.35 - i * 0.07; c.fillRect(Math.round(x - 52 - i * 9), Math.round(by - 4 + Math.sin(t / 6 + i * 2) * 4), 6, 6); }
    } else if (k === 'rainbow') {
      const cols = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#2979ff', '#d500f9'];
      for (let b = 0; b < 6; b++) for (let i = 0; i < 9; i++) {
        c.globalAlpha = 0.85 - i * 0.08; c.fillStyle = cols[b];
        c.fillRect(Math.round(x - 4 - i * 8), Math.round(by - 9 + b * 3 + Math.sin(t / 5 + i * 0.7) * 3), 8, 3);
      }
    } else if (k === 'shards') {
      for (let i = 0; i < 7; i++) {
        const px = x - 6 - i * 9, py = by + Math.sin(t / 7 + i * 1.3) * 10;
        c.globalAlpha = Math.max(0, (1 - i / 7) * (0.5 + 0.5 * Math.sin(t / 4 + i)));
        c.fillStyle = i % 2 ? '#e0f7fa' : '#80deea';
        c.fillRect(Math.round(px) - 1, Math.round(py) - 4, 2, 8); c.fillRect(Math.round(px) - 3, Math.round(py) - 1, 6, 2);
      }
    } else if (k === 'hearts') {
      for (let i = 0; i < 6; i++) {
        const py = by + 12 - ((t * 0.6 + i * 17) % 50), px = x - 4 - i * 10 + Math.sin(t / 8 + i) * 3;
        c.globalAlpha = clamp(1 - Math.abs(py - by) / 38, 0.15, 0.95); c.fillStyle = i % 2 ? '#ff4081' : '#ff80ab';
        heart(c, px, py, 2);
      }
    } else if (k === 'shadow') {
      for (let i = 1; i <= 3; i++) {
        c.globalAlpha = 0.28 - i * 0.07;
        if (duck) { c.fillStyle = '#1a1a1a'; c.fillRect(x - i * 14, y + 4, 40, 14); c.fillRect(x - i * 14 + 32, y, 22, 12); }
        else { drawRows(c, BODY, x - i * 14, y, SHADOW_CH, 0, t); drawRows(c, LEGS[0], x - i * 14, y + 32, SHADOW_CH, 16, t); }
        c.globalAlpha = 0.5 - i * 0.12; c.fillStyle = '#ff1744'; c.fillRect(x - i * 14 + (duck ? 44 : 30), y + (duck ? 2 : 4), 3, 3);
      }
    } else if (k === 'bats') {
      for (let i = 0; i < 3; i++) {
        const bx = Math.round(x - 14 - i * 18), bY = Math.round(y + 4 + i * 7 + Math.sin(t / 5 + i * 2) * 7), up = Math.floor(t / 5 + i) % 2;
        c.globalAlpha = 0.95; c.fillStyle = '#2a0a3a';
        c.fillRect(bx, bY, 5, 4); c.fillRect(bx - 6, bY + (up ? -3 : 2), 6, 3); c.fillRect(bx + 5, bY + (up ? -3 : 2), 6, 3);
        c.fillStyle = '#ff1744'; c.fillRect(bx + 1, bY + 1, 1, 1); c.fillRect(bx + 3, bY + 1, 1, 1);
      }
    } else if (k === 'aurora') {
      const cols = ['#69f0ae', '#b388ff', '#ff80ab'];
      for (let b = 0; b < 3; b++) for (let i = 0; i < 14; i++) {
        c.globalAlpha = Math.max(0, (1 - i / 14) * 0.5); c.fillStyle = cols[b];
        c.fillRect(Math.round(x - 4 - i * 7), Math.round(by - 14 + b * 9 + Math.sin(t / 9 + i * 0.5 + b) * 8), 8, 8);
      }
    } else if (k === 'inferno') {
      const cols = ['#fff176', '#ffb300', '#ff6d00', '#d84315', '#8d2c00', '#4e1500'];
      for (let i = 0; i < 7; i++) {
        const sz = 13 - i * 1.5; c.globalAlpha = 0.95 - i * 0.12; c.fillStyle = cols[Math.min(5, i)];
        c.fillRect(Math.round(x - 6 - i * 9), Math.round(by + Math.sin(t / 3 + i * 1.2) * 5 - sz / 2), Math.round(sz) + 2, Math.round(sz));
      }
    } else if (k === 'feathers') {
      for (let i = 0; i < 7; i++) {

  function pMove(y) {

  const isUI = e => e.target && e.target.closest && e.target.closest('#theme,#shopBtn,#hardBtn,#shop');

  addEventListener('touchmove', e => { if (isUI(e)) return; e.preventDefault(); pMove(e.touches[0].clientY); }, { passive: false });

  // ---------- 다크 모드 / 시작 구간 버튼 ----------

  tb.addEventListener('pointerup', e => {

  hb.addEventListener('click', () => {
    save.startStage = ((save.startStage || 0) + 1) % STAGES.length; persist(); syncStage();

  // ---------- 상점 ----------
  const shop = document.getElementById('shop');
  const grid = document.getElementById('charGrid');
  const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  function cardHTML(c, i) {
    const R = RARITY[c.rar], owned = isOwned(i), sel = save.sel === i;
    let label, dis = false;
    if (sel) { label = '사용 중'; dis = true; }
    else if (owned) label = '선택';
    else { label = '🪙 ' + fmt(c.cost); dis = save.gold < c.cost; }
    return '<div class="card r' + c.rar + (sel ? ' sel' : '') + '" style="--rc:' + R.color + '"><canvas width="100" height="72" data-i="' + i + '"></canvas>' +
      '<div class="nm">' + c.name + '<span class="badge" style="background:' + R.color + '">' + R.name + '</span></div>' +
      '<div class="pr">' + (c.cost ? '🪙 ' + fmt(c.cost) : '무료') + ' · ♥ ' + LIVES[c.rar] + '</div>' +

  function renderShop() {

  function drawPreviews(tt) {

  const confirmBox = document.getElementById('confirm');
  let pendingBuy = -1;
  function askBuy(i) {

  function closeConfirm() { confirmBox.hidden = true; pendingBuy = -1; }
  document.getElementById('cNo').addEventListener('click', closeConfirm);
  confirmBox.addEventListener('click', e => { if (e.target === confirmBox) closeConfirm(); });
  document.getElementById('cYes').addEventListener('click', () => {
    const i = pendingBuy; closeConfirm();

  });
  function openShop() { shopOpen = true; running = false; duckT = 0; touching = false; shop.hidden = false; closeConfirm(); renderShop(); }
  function closeShop() {

  document.getElementById('shopBtn').addEventListener('click', openShop);
  document.getElementById('shopClose').addEventListener('click', closeShop);
  shop.addEventListener('click', e => { if (e.target === shop) closeShop(); });
  grid.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b || b.disabled) return;

  });

  // ---------- 난이도 / 장애물 ----------
  function arrivalSpeed(xc) {   // 도착 시점의 속도 (속도는 계속 오르므로 미리 예측)
    const D = Math.max(0, xc - (dino.x + 21));
    let sa = speed;
    for (let i = 0; i < 3; i++) { const F = D / ((speed + sa) / 2); sa = speedAt(score + (speed + sa) / 2 * 0.12 * F); }
    return sa;
  }
  const progressOf = sa => clamp((sa - 5.5) / 8.5, 0, 1);
  const ceilP = () => score < 1000 ? 0.1 : score < 2000 ? 0.2 : score < 4000 ? 0.3 : 0.45;   // 선인장·가시 위 천장 장애물 확률

  function pickKind(prev) {
    let list = [['cactus', 5]];
    if (score > 100) list.push(['pit', 2.5]);
    if (score > 150) list.push(['spike', 3]);
    if (score > 200) list.push(['cactusT', 2]);
    if (score > 250) { list.push(['birdM', 2]); list.push(['birdH', 1.8]); }
    if (prev === 'cactusT') list = list.filter(a => a[0] !== 'birdM' && a[0] !== 'birdH');   // 2단 점프 직후엔 새 금지
    const tot = list.reduce((s, a) => s + a[1], 0);
    let r = Math.random() * tot;
    for (const a of list) { r -= a[1]; if (r <= 0) return a[0]; }
    return list[0][0];
  }
  function makeObstacle(kind) {
    const x = W + 30;
    if (kind === 'cactus' || kind === 'cactusT') {
      const n = kind === 'cactusT' ? rnd(1, 2) : rnd(1, 3), w = 14 * n + 4 * (n - 1);
      const sa = arrivalSpeed(x + w / 2), tol = tolAt(sa, score);
      const z = ((w - 6) / 2 + 13) / sa;
      let h;
      if (kind === 'cactus') h = clamp(Math.round(P1 + 4 - 0.3 * Math.pow(tol * (1 + Math.random() * 1.6) + z, 2)), 24, 100);
      else h = clamp(Math.round(P2 + 4 - 0.3 * Math.pow(tol * (1.3 + Math.random() * 0.9) + z, 2)), 106, 132);
      return { kind, type: 'cactus', x, y: GROUND - h, w, h, n, ceil: kind === 'cactus' && Math.random() < ceilP() };
    }
    if (kind === 'spike') {   // 땅에 깔린 가시: 폭이 넓어서 더 오래 떠 있어야 함
      const n = rnd(3, 7), w = 12 * n;
      const sa = arrivalSpeed(x + w / 2), tol = tolAt(sa, score), z = ((w - 6) / 2 + 13) / sa;
      const heff = clamp(Math.round(P1 + 4 - 0.3 * Math.pow(tol * (1 + Math.random() * 1.4) + z, 2)), 14, 34);
      return { kind, type: 'spike', x, y: GROUND - heff, w, h: heff, vh: Math.round(heff / 0.75), ceil: Math.random() < ceilP() };
    }
    if (kind === 'birdM' || kind === 'birdH') {   // 낮게(머리 높이) / 높이 나는 새
      const b0 = kind === 'birdH' ? 104 : 28;
      return { kind, type: 'bird', x, y: GROUND - b0 - 36, w: 32, h: 36 };
    }
    const sa = arrivalSpeed(x + 60), tol = tolAt(sa, score) * (1 + Math.random());
    const w = clamp(Math.round(20 + sa * (SIM1.length - 2 * tol)), 70, 780);   // 구덩이도 같은 오차 기준
    return { kind: 'pit', type: 'pit', x, y: GROUND, w, h: 0 };
  }
  const ceilRect = o => o.type === 'pit' ? { x: o.x, w: o.w } : (o.ceil ? { x: o.x - 22, w: o.w + 44 } : null);
  function addCoin(x, y) { coins.push({ x, y, ph: Math.random() * 20 }); }
  function pathCoins(xc, sa, sim, ap, frames) {   // 완벽한 점프 궤적 위에 코인 배치
    frames.forEach(n => { if (n < sim.length - 1) addCoin(xc + sa * (n - ap), GROUND - 19 - sim[n]); });
  }
  function spawnCoins(o) {
    const xc = o.x + o.w / 2, sa = arrivalSpeed(xc);
    if (o.kind === 'cactus' || o.kind === 'pit' || o.kind === 'spike') pathCoins(xc, sa, SIM1, AP1, [4, 8, 12, AP1, 22, 26, 30]);
    else if (o.kind === 'cactusT') pathCoins(xc, sa, SIM2, AP2, [4, 9, 14, 19, AP2, 31, 36, 41]);
    else if (o.kind === 'birdM') for (let i = 0; i < 4; i++) addCoin(o.x - 8 + i * 16, GROUND - 14);   // 숙이고 지나가며 획득
    else if (o.kind === 'birdH') for (let i = 0; i < 4; i++) addCoin(o.x - 8 + i * 16, GROUND - 20);
  }
  function obsBoxes(o) {
    const out = [];
    if (o.type === 'bird') out.push({ x: o.x + 1, y: o.y + 4, w: 30, h: 32 });
    else if (o.type !== 'pit') out.push({ x: o.x + 3, y: o.y + 3, w: o.w - 6, h: o.h - 6 });
    const cr = ceilRect(o);
    if (cr) out.push({ x: cr.x + 2, y: CEIL_Y0, w: cr.w - 4, h: CEIL_Y1 - CEIL_Y0 });
    return out;
  }
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function die(fall) {
    over = true; running = false; overAt = performance.now();
    dino.falling = !!fall; dino.fallV = 2; dino.ducking = false;
    const s = Math.floor(score);
    if (s > save.hi) save.hi = s;
    persist(); tryReload();
  }
  function hurt(fall, pit) {   // 목숨이 남아 있으면 무적 시간과 함께 계속, 아니면 게임 오버
    lives--;
    if (lives <= 0) { die(fall); return true; }
    inv = INV_T; toast.s = '목숨 -1'; toast.t = 70;
    if (fall && pit) {   // 구덩이는 메우고 땅 위로 복귀
      obstacles = obstacles.filter(o => o !== pit);
      dino.y = GROUND - 40; dino.vy = 0; dino.onGround = true; dino.jumps = 0;
    }
    return false;
  }

  function update(k) {
    frame += k;
    const fx1 = dino.x + 10, fx2 = dino.x + 30;
    const pit = inv > 0 ? null : obstacles.find(o => o.type === 'pit' && fx1 > o.x && fx2 < o.x + o.w);   // 무적 중엔 구덩이도 무시
    const overPit = !!pit;
    dino.ducking = duckT > 0 && dino.onGround;
    if (dino.onGround && overPit) { dino.onGround = false; dino.vy = 0; dino.jumps = 2; }
    if (!dino.onGround) {
      dino.vy += (duckT > 0 ? 1.4 : G) * k;
      dino.y += dino.vy * k;
      if (dino.y >= GROUND - 40) {
        if (!overPit) { dino.y = GROUND - 40; dino.vy = 0; dino.onGround = true; dino.jumps = 0; }
        else if (dino.y > GROUND - 32) { if (hurt(true, pit)) return; }
      }
    }
    if (duckT > 0) duckT -= k;
    if (inv > 0) inv -= k;
    score += speed * 0.12 * k;
    gscroll += speed * k;
    speed = speedAt(score);
    const ns = stageOf(score);
    if (ns !== stIdx) { stPrev = stIdx; stIdx = ns; stT = 0; bannerT = 150; }
    if (bannerT > 0) bannerT -= k;

    spawnIn -= k;
    if (spawnIn <= 0) {
      const kind = nextKind || pickKind(null);
      const o = makeObstacle(kind);
      o.st = stIdx;   // 생성될 때의 구간 테마로 그려짐
      obstacles.push(o); spawnCoins(o);
      nextKind = pickKind(kind);
      // 앞 장애물을 처리할 시간을 확보. 빨라질수록(후반) 간격은 더 좁아짐
      let gap = GAP[kind] + (kind === 'pit' ? o.w / speed : 0) + (nextKind === 'cactusT' ? 10 : 0) + 8 + Math.random() * 28;
      gap *= clamp(1.1 - 0.15 * progressOf(speed) - 0.2 * clamp((score - 2125) / 14000, 0, 1), 0.8, 1.1);
      spawnIn = gap;
      let placed = false;
      if (itemIn <= 0 && gap >= 70) {   // 장애물 사이 빈 구간 한가운데에 아이템
        items.push({ type: Math.random() < 0.5 ? 'magnet' : 'x2', x: W + 30 + gap * speed * 0.5, y: GROUND - 26, ph: Math.random() * 40 });
        itemIn = rnd(900, 1500); placed = true;
      }
      if (!placed && gap > 100) { const cx = W + 30 + gap * speed * 0.55; for (let i = 0; i < 3; i++) addCoin(cx + i * 28, GROUND - 20); }
    }
    obstacles.forEach(o => o.x -= speed * k);
    coins.forEach(c => c.x -= speed * k);
    items.forEach(it => it.x -= speed * k);
    itemIn -= k;
    obstacles = obstacles.filter(o => o.x + Math.max(o.w, (ceilRect(o) || { w: 0 }).w) > -30);
    clouds.forEach(c => { c.x -= speed * 0.2 * k; if (c.x < -50) { c.x = W + 20; c.y = 25 + Math.random() * 60; } });

    const box = dino.ducking
      ? { x: dino.x + 4, y: GROUND - 22, w: 50, h: 20 }
      : { x: dino.x + 8, y: dino.y + 4, w: 26, h: 34 };
    if (inv <= 0) {
      for (const o of obstacles) {
        if (obsBoxes(o).some(b => hit(box, b))) { if (hurt(false, null)) return; break; }
      }
    }
    const cb = dino.ducking ? { x: dino.x, y: GROUND - 24, w: 52, h: 24 } : { x: dino.x + 6, y: dino.y + 2, w: 30, h: 38 };
    // 자석: 가까운 코인을 끌어당김
    if (magnetT > 0) {
      const px = dino.x + 21, py = dino.ducking ? GROUND - 12 : dino.y + 21;
      coins.forEach(c => {
        const dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy);
        if (d < 170 && d > 1) { const pull = Math.min(d, 8 + speed * 1.1 + (170 - d) * 0.06); c.x += dx / d * pull * k; c.y += dy / d * pull * k; }
      });
    }
    // 아이템 획득
    items = items.filter(it => {
      if (it.x < -30) return false;
      const iy = it.y + Math.sin((frame + it.ph) / 10) * 3;
      if (it.x > cb.x - 14 && it.x < cb.x + cb.w + 14 && iy > cb.y - 14 && iy < cb.y + cb.h + 14) {
        if (it.type === 'magnet') { magnetT = ITEM_T; toast.s = '자석!'; } else { x2T = ITEM_T; toast.s = '골드 x2!'; }
        toast.t = 90; return false;
      }
      return true;
    });
    if (magnetT > 0) magnetT -= k;
    if (x2T > 0) x2T -= k;
    if (toast.t > 0) toast.t -= k;
    let got = 0;
    coins = coins.filter(c => {
      if (c.x < -20) return false;
      if (c.x > cb.x - 9 && c.x < cb.x + cb.w + 9 && c.y > cb.y - 9 && c.y < cb.y + cb.h + 9) { got++; return false; }
      return true;
    });
    if (got) { const g = got * (x2T > 0 ? 2 : 1); save.gold += g; runGold += g; persist(); }
  }

  // ---------- 그리기: 장애물 (구간별 테마) ----------
  function drawPillar(o) {   // 선인장 / 석조 기둥 / 크리스탈 / 흑요석 첨탑 / 대리석 기둥
    const st = o.st | 0;
    for (let i = 0; i < o.n; i++) {
      const x = o.x + i * 18, y = o.y, h = o.h;
      if (st === 0) {
        ctx.fillStyle = FG;
        ctx.fillRect(x + 5, y, 5, h); ctx.fillRect(x, y + Math.round(h * 0.35), 5, 4); ctx.fillRect(x, y + Math.round(h * 0.2), 3, Math.round(h * 0.2));
        ctx.fillRect(x + 10, y + Math.round(h * 0.5), 5, 4); ctx.fillRect(x + 12, y + Math.round(h * 0.3), 3, Math.round(h * 0.25));
      } else if (st === 1) {
        ctx.fillStyle = '#78909c'; ctx.fillRect(x + 1, y, 12, h);
        ctx.fillStyle = '#90a4ae'; ctx.fillRect(x, y, 14, 5); ctx.fillRect(x, y - 3, 4, 3); ctx.fillRect(x + 10, y - 3, 4, 3);
        ctx.fillStyle = '#546e7a';
        for (let by = y + 9, r = 0; by < y + h - 2; by += 9, r++) { ctx.fillRect(x + 1, by, 12, 1); ctx.fillRect(x + (r % 2 ? 4 : 9), by - 9, 1, 9); }
      } else if (st === 2) {
        const g = ctx.createLinearGradient(0, y, 0, y + h);
        g.addColorStop(0, '#e0f7fa'); g.addColorStop(0.5, '#4dd0e1'); g.addColorStop(1, '#7e57c2');
        ctx.fillStyle = g; ctx.beginPath();
        ctx.moveTo(x + 3, y); ctx.lineTo(x + 11, y); ctx.lineTo(x + 14, y + h * 0.35); ctx.lineTo(x + 12, y + h); ctx.lineTo(x + 2, y + h); ctx.lineTo(x, y + h * 0.35);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath();
        ctx.moveTo(x + 4, y + 1); ctx.lineTo(x + 7, y + 1); ctx.lineTo(x + 6, y + h * 0.85); ctx.lineTo(x + 3, y + h * 0.85); ctx.closePath(); ctx.fill();
        if (o.kind === 'cactusT') { ctx.fillStyle = Math.floor(frame / 15) % 2 ? '#ff5252' : '#7f0000'; ctx.fillRect(x + 5, y + 2, 4, 4); }
      } else if (st === 3) {
        ctx.fillStyle = '#2b0d0d'; ctx.strokeStyle = '#ff5722'; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(x + 3, y); ctx.lineTo(x + 11, y); ctx.lineTo(x + 14, y + h * 0.4); ctx.lineTo(x + 12, y + h); ctx.lineTo(x + 2, y + h); ctx.lineTo(x, y + h * 0.4);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        const f = Math.floor(frame / 4 + i) % 3;
        ctx.fillStyle = '#ff9800'; ctx.fillRect(x + 4, y - 4 - f, 6, 4 + f); ctx.fillStyle = '#ffeb3b'; ctx.fillRect(x + 6, y - 2 - f, 2, 2 + f);
      } else {
        ctx.fillStyle = '#fff8e1'; ctx.fillRect(x + 2, y + 5, 10, Math.max(2, h - 9));
        ctx.fillStyle = '#e0b84a'; ctx.fillRect(x, y, 14, 5); ctx.fillRect(x, y + h - 4, 14, 4);
        ctx.fillStyle = '#f0dc9a'; ctx.fillRect(x + 5, y + 6, 1, Math.max(2, h - 12)); ctx.fillRect(x + 9, y + 6, 1, Math.max(2, h - 12));
        ctx.fillStyle = 'rgba(255,255,255,0.8)'; if (Math.floor(frame / 12 + i) % 2) ctx.fillRect(x + 6, y - 3, 2, 2);
      }
    }
  }
  function drawSpikes(o) {   // 땅 가시
    const st = o.st | 0, n = Math.round(o.w / 12), vh = o.vh;
    const col = [FG, '#90a4ae', '#ce93d8', '#ff6d00', '#ffd54f'][st];
    ctx.fillStyle = col; ctx.beginPath();
    for (let i = 0; i < n; i++) { const x = o.x + i * 12; ctx.moveTo(x, GROUND); ctx.lineTo(x + 6, GROUND - vh); ctx.lineTo(x + 12, GROUND); }
    ctx.fill();
    for (let i = 0; i < n; i++) {
      const x = o.x + i * 12;
      if (st === 1) { ctx.fillStyle = '#eceff1'; ctx.fillRect(x + 5, GROUND - vh + 4, 2, Math.round(vh * 0.4)); }

    ctx.fillStyle = FG; ctx.textAlign = 'right'; ctx.font = 'bold 16px "Courier New", monospace';
    const pad = n => String(n).padStart(5, '0');
    ctx.globalAlpha = 0.55; ctx.fillText('HI ' + pad(save.hi), W - 120, 24); ctx.globalAlpha = 1;
    ctx.fillText(pad(Math.floor(score)), W - 16, 24);
    ctx.textAlign = 'center';
    if (bannerT > 0 && stIdx > 0) {
      ctx.globalAlpha = Math.min(1, bannerT / 30);
      ctx.fillStyle = STAGES[stIdx].ac; ctx.font = 'bold 28px "Courier New", monospace'; ctx.fillText(STAGES[stIdx].name + ' 구간', W / 2, 90);
      ctx.fillStyle = FG; ctx.font = '14px "Courier New", monospace'; ctx.fillText('STAGE ' + (stIdx + 1), W / 2, 112);
      ctx.globalAlpha = 1; ctx.fillStyle = FG;
    }
    if (toast.t > 0) { ctx.globalAlpha = Math.min(1, toast.t / 30); ctx.fillStyle = '#ffc107'; ctx.font = 'bold 18px "Courier New", monospace'; ctx.fillText(toast.s, W / 2, 50); ctx.globalAlpha = 1; ctx.fillStyle = FG; }
    ctx.font = 'bold 16px "Courier New", monospace';
    if (!running && !over) ctx.fillText('탭 또는 SPACE로 ' + (frame > 0 ? '계속' : '시작'), W / 2, 150);
    if (over) {
      ctx.font = 'bold 22px "Courier New", monospace';
      ctx.fillText('G A M E   O V E R', W / 2, 130);
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('획득 골드 +' + runGold, W / 2, 156);
      ctx.fillText('탭 또는 SPACE로 다시 시작', W / 2, 178);
    }
    FG = TFG; BG = TBG;
  }

  function loop(ts) {
    if (!last) last = ts;
    const dt = ts - last; last = ts;
    dtS += (Math.min(dt, 50) - dtS) * 0.15;
    const k = Math.min(dtS / 16.667, 3);
    if (running && !shopOpen) update(k);
    if (stT < 1) stT = Math.min(1, stT + 0.02 * k);
    if (over && dino.falling && dino.y < H + 80) { dino.fallV += 0.6 * k; dino.y += dino.fallV * k; }
    draw();
    if (shopOpen) drawPreviews(ts / 16.667);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- 새 버전 자동 새로고침 ----------
  function tryReload() {
    if (!pendingReload || running || shopOpen) return;
    try { location.replace(location.pathname + '?v=' + pendingReload); } catch (e) {}
  }
  async function checkUpdate() {
    try {
      const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const m = (await r.text()).match(/VERSION\s*=\s*'(\d{8}-\d+)'/);
      if (m && m[1] !== VERSION) { pendingReload = m[1]; tryReload(); }
    } catch (e) {}
  }
  setInterval(() => { checkUpdate(); tryReload(); }, 30000);
  setTimeout(checkUpdate, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
})();
</script>
</body>
